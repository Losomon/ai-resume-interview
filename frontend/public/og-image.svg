      <stop offset="100%" stop-color="#86EFAC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="250" rx="500" ry="280" fill="url(#glow)"/>

  <g transform="translate(552, 130)">
    <path
